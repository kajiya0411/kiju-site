<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お祝いサイト</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff8f5;
      font-family: sans-serif;
    }

    .box {
      text-align: center;
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      width: 80%;
      max-width: 400px;
    }

    h1 {
      margin-bottom: 25px;
    }

    input {
      padding: 12px;
      width: 80%;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 12px 30px;
      border: none;
      border-radius: 20px;
      background: #e99a9a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #error {
      color: #d66;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>喜寿のお祝い</h1>

  <p>じぃじの誕生日を半角4桁で入力してください。<br>開いても大したものはないよ。数日で閉鎖予定。</p>

  <input type="password" id="password" placeholder="パスワード">

  <br>

  <button onclick="checkPassword()">見る</button>

  <p id="error"></p>

</div>

<script>

function checkPassword() {

  const password = document.getElementById("password").value;

  if (password === "0724") {

    sessionStorage.setItem("authenticated", "true");

    window.location.href = "index.html";

  } else {

    document.getElementById("error").textContent =
      "パスワードが違います";

  }

}

</script>

</body>
</html>
